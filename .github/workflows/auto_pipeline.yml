name: Auto Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run (batch or ig-scheduler)'
        required: true
        default: 'batch'
        type: choice
        options:
          - batch
          - ig-scheduler

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
        current_hour=$(date -u +"%H")
        current_minute=$(date -u +"%M")
        
        is_batch="false"
        if [ "${{ github.event.inputs.task }}" == "batch" ]; then
            is_batch="true"
        elif [ "$GITHUB_EVENT_NAME" == "schedule" ] && [ "$current_hour" == "06" ] && [ "$current_minute" -lt "15" ]; then
            is_batch="true"
        fi
        
        if [ "$is_batch" == "true" ]; then
            python -m playwright install chromium
        else
            echo "Skipping playwright install for lightweight scheduler."
        fi

    - name: Restore Credentials from Secrets
      env:
        ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        CLIENT_SECRET_CONTENT: ${{ secrets.CLIENT_SECRET_JSON }}
        TOKEN_CONTENT: ${{ secrets.TOKEN_JSON }}
        STORAGE_STATE_CONTENT: ${{ secrets.STORAGE_STATE_JSON }}
        GCP_SERVICE_ACCOUNT_CONTENT: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      run: |
        echo "$ENV_FILE_CONTENT" > .env
        echo "$CLIENT_SECRET_CONTENT" > client_secret.json
        echo "$TOKEN_CONTENT" > token.json
        echo "$GCP_SERVICE_ACCOUNT_CONTENT" > service-account.json
        mkdir -p ~/.notebooklm/profiles/default/
        echo "$STORAGE_STATE_CONTENT" > ~/.notebooklm/profiles/default/storage_state.json

    - name: Run Pipeline (Batch or IG Scheduler)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        source .env
        
        current_hour=$(date -u +"%H")
        current_minute=$(date -u +"%M")

        if [ "${{ github.event.inputs.task }}" == "ig-scheduler" ]; then
            echo "⏰ Running lightweight Instagram Scheduler (Render Trigger)..."
            python -u main.py run --ig-scheduler
            
        elif [ "${{ github.event.inputs.task }}" == "batch" ]; then
            echo "🚀 Starting daily batch generation (Render or UI Trigger)..."
            python -u main.py run --batch
            
        elif [ "$GITHUB_EVENT_NAME" == "schedule" ] && [ "$current_hour" == "06" ] && [ "$current_minute" -lt "15" ]; then
            echo "🚀 Starting daily batch generation (Scheduled)..."
            python -u main.py run --batch
            
        else
            echo "⏰ Running lightweight Instagram Scheduler (Scheduled)..."
            python -u main.py run --ig-scheduler
        fi

    - name: Commit & Push Updated State
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Pull latest first to avoid overwriting newer commits (e.g. manual state restores)
        git pull --rebase origin main || true
        git add memory/ || true
        git add analytics/ || true
        git commit -m "chore: Update pipeline state and topic logs [skip ci]" || true
        git push origin main || true
