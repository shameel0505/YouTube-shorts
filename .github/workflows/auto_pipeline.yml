name: Auto Pipeline

on:
  schedule:
    # Runs once a day at 06:00 UTC (10:00 AM UAE time) for Batch Generation.
    - cron: '0 6 * * *'
    # Runs every 15 minutes to check for scheduled Instagram posts in pending_ig.json
    - cron: '*/15 * * * *'
  workflow_dispatch:        # Allows manual trigger from the GitHub UI

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install chromium

    - name: Restore Credentials from Secrets
      env:
        ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        CLIENT_SECRET_CONTENT: ${{ secrets.CLIENT_SECRET_JSON }}
        TOKEN_CONTENT: ${{ secrets.TOKEN_JSON }}
        STORAGE_STATE_CONTENT: ${{ secrets.STORAGE_STATE_JSON }}
      run: |
        echo "$ENV_FILE_CONTENT" > .env
        echo "$CLIENT_SECRET_CONTENT" > client_secret.json
        echo "$TOKEN_CONTENT" > token.json
        mkdir -p ~/.notebooklm/profiles/default/
        echo "$STORAGE_STATE_CONTENT" > ~/.notebooklm/profiles/default/storage_state.json

    - name: Run Pipeline (Batch or IG Scheduler)
      run: |
        source .env
        
        # We determine which task to run based on the hour.
        # If it's around 06:00 UTC (batch generation time), we run the heavy batch.
        # Otherwise, we just run the lightweight IG scheduler.
        
        current_hour=$(date -u +"%H")
        current_minute=$(date -u +"%M")
        
        # If manually triggered via workflow_dispatch, we assume they want the batch generation.
        if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            echo "🚀 Starting daily batch generation (Manual Trigger)..."
            python -u main.py run --batch
        # Or if it's the exact 06:00 UTC cron trigger (allowing a 15 min window for runner delays)
        elif [ "$current_hour" == "06" ] && [ "$current_minute" -lt "15" ]; then
            echo "🚀 Starting daily batch generation (Scheduled)..."
            python -u main.py run --batch
        else
            echo "⏰ Running lightweight Instagram Scheduler..."
            python -u main.py run --ig-scheduler
        fi

    - name: Commit & Push Updated State
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Pull latest first to avoid overwriting newer commits (e.g. manual state restores)
        git pull --rebase origin main || true
        git add memory/ || true
        git add analytics/ || true
        git commit -m "chore: Update pipeline state and topic logs [skip ci]" || true
        git push origin main || true
