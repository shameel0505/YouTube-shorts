name: Daily Fresh Pipeline

on:
  schedule:
    - cron: '0 9 * * *'  # Runs every day at 09:00 UTC
  workflow_dispatch:      # Allows manual trigger from the GitHub UI

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install chromium

    - name: Restore Credentials from Secrets
      run: |
        echo "${{ secrets.ENV_FILE }}" > .env
        echo "${{ secrets.CLIENT_SECRET_JSON }}" > client_secret.json
        echo "${{ secrets.TOKEN_JSON }}" > token.json
        mkdir -p ~/.notebooklm/profiles/default/
        echo "${{ secrets.STORAGE_STATE_JSON }}" > ~/.notebooklm/profiles/default/storage_state.json

    - name: Run Fresh Pipeline
      run: |
        echo "🚀 Triggering fresh daily pipeline..."
        python -u main.py run --fresh --format all

    - name: Commit & Push Updated State
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add memory/ || true
        git add analytics/ || true
        git commit -m "chore: Update pipeline state and topic logs [skip ci]" || true
        git pull --rebase origin main || true
        git push origin main || true
