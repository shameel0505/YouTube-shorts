name: Daily Shorts & Reels Uploader

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour on the hour
  workflow_dispatch:      # Allows manual trigger from the GitHub UI

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install chromium

    - name: Restore Credentials from Secrets
      run: |
        echo "${{ secrets.ENV_FILE }}" > .env
        echo "${{ secrets.CLIENT_SECRET_JSON }}" > client_secret.json
        echo "${{ secrets.TOKEN_JSON }}" > token.json

    - name: Run Pipeline
      run: |
        echo "🔍 DEBUG: Listing workspace root files..."
        python -c "import os; print(os.listdir('.'))"
        echo "🔍 DEBUG: Checking python sys.path..."
        python -c "import sys; print(sys.path)"
        echo "🔍 DEBUG: Attempting to import notebooklm..."
        python -c "import notebooklm; print('notebooklm imported from:', notebooklm.__file__ if hasattr(notebooklm, '__file__') else 'unknown location')" || true
        
        HOUR=$(date -u +%H)
        # Daily full run starts at 09:00 UTC (13:00 local time)
        if [ "$HOUR" = "09" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "🚀 Daily trigger time (09:00 UTC). Running full pipeline..."
          python -u main.py run --format all
        else
          echo "⏳ Checking and resuming pending video renders..."
          python -u main.py run --format all --resume-only
        fi

    - name: Commit & Push Updated Topic Logs
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add memory/ || true
        git add analytics/ || true
        git commit -m "chore: Update used topics, rendering states, and analytics log [skip ci]" || true
        git pull --rebase origin main || true
        git push origin main || true
