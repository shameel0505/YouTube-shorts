name: Daily Shorts & Reels Uploader

on:
  schedule:
    - cron: '0 10 * * *'  # Runs every day at 10:00 UTC
  workflow_dispatch:      # Allows manual trigger from the GitHub UI

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore Credentials from Secrets
      run: |
        echo "${{ secrets.ENV_FILE }}" > .env
        echo "${{ secrets.CLIENT_SECRET_JSON }}" > client_secret.json
        echo "${{ secrets.TOKEN_JSON }}" > token.json

    - name: Run Pipeline
      run: |
        python main.py run --format all

    - name: Commit & Push Updated Topic Logs
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add memory/ || true
        git add analytics/ || true
        git commit -m "chore: Update used topics and analytics log [skip ci]" || true
        git push origin main || true
